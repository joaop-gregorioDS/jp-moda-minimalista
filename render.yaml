services:
  - type: web
    name: jp-store-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
