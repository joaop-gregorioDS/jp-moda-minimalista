name: JPMinimal
options:
  bundleIdPrefix: br.com
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  xcodeVersion: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Production.xcconfig
  Release: Config/Production.xcconfig
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: br.com.jpminimal
    PRODUCT_NAME: JPMinimal
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: JPMinimal/Info.plist
    GENERATE_INFOPLIST_FILE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  JPMinimal:
    type: application
    platform: iOS
    sources:
      - path: JPMinimal
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.jpminimal
        INFOPLIST_FILE: JPMinimal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
schemes:
  JPMinimal:
    build:
      targets:
        JPMinimal: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
